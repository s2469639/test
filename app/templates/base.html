<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>{% block title %}사부작{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">✦</span>
        <div>
          <div class="brand-name">사부작</div>
          <div class="brand-sub">박람회 운영 대시보드</div>
        </div>
      </div>
      <nav>
        <a href="{{ url_for('dashboard.index') }}">대시보드</a>
        <a href="{{ url_for('drafts.index') }}">작성 중인 박람회</a>
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/base.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
